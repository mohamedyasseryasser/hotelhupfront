<main class="container py-4" dir="rtl">

  <a
    class="btn btn-link px-0 mb-3"
    [routerLink]="['/properties', propertyId(), 'guests']"
  >
    ← العودة إلى الضيوف
  </a>

  <section class="card border-0 shadow-sm">

    <div class="card-body p-4">

      <span class="text-primary small fw-semibold">
        GUEST
      </span>

      <h1 class="h3 mb-1">
        {{ guest() ? 'تعديل بيانات الضيف' : 'إضافة ضيف' }}
      </h1>

      <p class="text-body-secondary">
        أدخل البيانات الأساسية وبيانات التواصل.
      </p>

      @if (error()) {
        <div class="alert alert-danger">
          {{ error() }}
        </div>
      }

      @if (loading()) {
        <div class="text-body-secondary py-3">
          جارٍ تحميل بيانات الضيف...
        </div>
      } @else {

        <form
          [formGroup]="form"
          (ngSubmit)="save()"
          novalidate
        >

          <div class="row g-3">

            <div class="col-md-6">
              <label class="form-label">
                الاسم الأول <span class="text-danger">*</span>
              </label>
              <input
                class="form-control"
                formControlName="firstName"
              >
            </div>

            <div class="col-md-6">
              <label class="form-label">
                اسم العائلة <span class="text-danger">*</span>
              </label>
              <input
                class="form-control"
                formControlName="lastName"
              >
            </div>

            <div class="col-md-4">
              <label class="form-label">نوع الهوية</label>
              <input
                class="form-control"
                formControlName="identityType"
              >
            </div>

            <div class="col-md-4">
              <label class="form-label">رقم الهوية</label>
              <input
                class="form-control"
                formControlName="identityNumber"
              >
            </div>

            <div class="col-md-4">
              <label class="form-label">الرقم القومي</label>
              <input
                class="form-control"
                formControlName="nationalId"
              >
            </div>

            <div class="col-md-6">
              <label class="form-label">الهاتف</label>
              <input
                class="form-control"
                formControlName="phone"
              >
            </div>

            <div class="col-md-6">
              <label class="form-label">البريد الإلكتروني</label>
              <input
                class="form-control"
                type="email"
                formControlName="email"
              >
            </div>

            <div class="col-md-8">
              <label class="form-label">العنوان</label>
              <input
                class="form-control"
                formControlName="address"
              >
            </div>

            <div class="col-md-4">
              <label class="form-label">الجنسية</label>
              <input
                class="form-control"
                formControlName="nationality"
              >
            </div>

            <div class="col-md-6">
              <label class="form-label">التفضيلات</label>
              <textarea
                class="form-control"
                rows="4"
                formControlName="preferences"
              ></textarea>
            </div>

            <div class="col-md-6">
              <label class="form-label">الملاحظات الداخلية</label>
              <textarea
                class="form-control"
                rows="4"
                formControlName="internalNotes"
              ></textarea>
            </div>

            <div class="col-12">
              <label class="form-label">ملاحظات ظاهرة للضيف</label>
              <textarea
                class="form-control"
                rows="3"
                formControlName="guestVisibleNotes"
              ></textarea>
            </div>

          </div>
@if (permissions.canUpdateGuest()) {
          <div class="d-flex gap-2 mt-4">

            <button
              class="btn btn-primary"
              type="submit"
              [disabled]="saving()"
            >
              {{ saving() ? 'جارٍ الحفظ...' : 'حفظ' }}
            </button>

            <a
              class="btn btn-outline-secondary"
              [routerLink]="['/properties', propertyId(), 'guests']"
            >
              إلغاء
            </a>

          </div>
        }
        </form>

      }

    </div>

  </section>

</main>
