<main class="form-page" dir="rtl">
  <a class="back" routerLink="/users" [queryParams]="{ propertyId: propertyIdquery() }">
    ← العودة إلى المستخدمين
  </a>

  <section class="card">
    <p class="eyebrow">HOTELHUP PMS / USERS</p>
    <h1>{{ isEdit() ? 'تعديل مستخدم' : 'إضافة مستخدم جديد' }}</h1>
    <p class="muted">أدخل بيانات المستخدم واختر دورًا نشطًا.</p>

    @if (loading()) {
      <p class="state">جارٍ تحميل المستخدم...</p>
    } @else {
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="grid">
          <label>اسم المستخدم
            <input formControlName="userName" autocomplete="username" />
            @if (form.controls.userName.invalid && form.controls.userName.touched) {
              <small>اسم المستخدم مطلوب، من 3 إلى 256 حرفًا.</small>
            }
          </label>

          <label>البريد الإلكتروني
            <input type="email" formControlName="email" autocomplete="email" />
            @if (form.controls.email.invalid && form.controls.email.touched) {
              <small>أدخل بريدًا إلكترونيًا صحيحًا.</small>
            }
          </label>

          <label>الاسم الكامل
            <input formControlName="fullName" />
            @if (form.controls.fullName.invalid && form.controls.fullName.touched) {
              <small>الاسم مطلوب، من حرفين إلى 200 حرف.</small>
            }
          </label>

          <label>العنوان
            <input formControlName="address" />
            @if (form.controls.address.invalid && form.controls.address.touched) {
              <small>العنوان يجب ألا يتجاوز 1000 حرف.</small>
            }
          </label>

          @if (!isEdit()) {
            <label>كلمة المرور
              <input type="password" formControlName="password" autocomplete="new-password" />
              @if (form.controls.password.invalid && form.controls.password.touched) {
                <small>كلمة المرور من 6 إلى 128 حرفًا.</small>
              }
            </label>
          }

          <label>الدور
            <select
              formControlName="roleId"
              [disabled]="rolesLoading() || (isEdit() && !permissions.canAssignRole())"
              aria-label="اختيار دور المستخدم"
            >
              <option value="" disabled>اختر دورًا نشطًا</option>
              @for (role of roles(); track role.roleId) {
                <option [value]="role.roleId">{{ role.roleName }}</option>
              }
            </select>
            @if (form.controls.roleId.invalid && form.controls.roleId.touched) {
              <small>يجب اختيار دور للمستخدم.</small>
            }
            @if (rolesError()) {
              <small role="alert">{{ rolesError() }}</small>
            } @else if (rolesLoading()) {
              <small class="role-state">جارٍ تحميل الأدوار...</small>
            } @else if (roles().length === 0) {
              <small class="role-state">لا توجد أدوار نشطة متاحة.</small>
            }
          </label>
        </div>

        @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
        @if (success()) { <p class="success" role="status">{{ success() }}</p> }

        <div class="actions">
          <button
            class="primary"
            type="submit"
            [disabled]="saving()"
            [class.hidden]="isEdit() ? !permissions.canUpdateUser() : !permissions.canCreateUser()"
          >
            {{ saving() ? 'جارٍ الحفظ...' : 'حفظ' }}
          </button>
          <a class="secondary" (click)="createqueryparam()">إلغاء</a>
        </div>
      </form>
    }
  </section>
</main>
